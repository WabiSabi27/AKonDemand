name: Exported API origin browser regression

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-origin-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-origin-browser:
    name: Exported API origins (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked mobile dependencies
        run: pnpm --filter @workspace/mobile... install --frozen-lockfile
      - name: Install Chromium and Linux dependencies
        run: pnpm --filter @workspace/mobile exec playwright install --with-deps chromium
      # The spec builds exactly once. This job has its own runner/checkout, so
      # no other browser suite writes to its web-dist directory.
      - name: Build once and check API origins with isolated fixtures
        run: pnpm --filter @workspace/mobile run test:browser:api-origin
      - name: Retain browser failure traces and screenshots
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-origin-browser-failures
          path: generated-artifacts/api-origin-browser/
          if-no-files-found: ignore
          retention-days: 14
