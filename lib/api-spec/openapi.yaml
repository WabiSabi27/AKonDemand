      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /availability:
    get:
      operationId: getAvailability
      tags: [scheduling]
      summary: Compute available time slots for a service on a date
      parameters:
        - name: serviceId
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          description: YYYY-MM-DD
          schema:
            type: string
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/customer:
    post:
      operationId: loginCustomer
      tags: [auth]
      summary: Frictionless customer signup-or-login (email + name)
      description: |
        Upserts a customer user keyed by email. No password — matches the existing
        mobile UX where customers tap "continue" with just name + email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerLoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/business/login:
    post:
      operationId: loginBusiness
      tags: [auth]
      summary: Service provider login (email + password)
      description: Verifies password against the bcrypt hash stored on the SP's biz_account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessLoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/business/forgot-password:
    post:
      operationId: forgotBusinessPassword
      tags: [auth]
      summary: Request a password-reset email for a service-provider account
      description: |
        Always returns 200 regardless of whether the email exists, to avoid
        account enumeration. When the account exists, a single-use reset link
        (valid 1 hour) is emailed to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Accepted (whether or not the account exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/business/reset-password:
    post:
      operationId: resetBusinessPassword
      tags: [auth]
      summary: Set a new service-provider password using an emailed reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/admin:
    post:
      operationId: loginAdmin
      tags: [auth]
      summary: Admin login via email + password (and optional TOTP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid email, password, or TOTP code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: Account temporarily locked after repeated failed attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLockedResponse"

  /auth/admin/change-password:
    post:
      operationId: adminChangePassword
      tags: [auth]
      summary: Admin changes their own password.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChangePasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/admin/totp/enroll:
    post:
      operationId: adminTotpEnroll
      tags: [auth]
      summary: Begin TOTP enrollment; returns secret + otpauth URL for the authenticator app.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Enrollment started — admin must call /confirm with a valid code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTotpEnrollment"
        "409":
          description: TOTP already enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/admin/totp/confirm:
    post:
      operationId: adminTotpConfirm
      tags: [auth]
      summary: Finish TOTP enrollment by submitting a valid code.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTotpConfirmRequest"
      responses:
        "200":
          description: TOTP confirmed; future logins must include a code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Invalid code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No pending enrollment, or already confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/admin/totp/disable:
    post:
      operationId: adminTotpDisable
      tags: [auth]
      summary: Disable TOTP after re-verifying password.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTotpDisableRequest"
      responses:
        "200":
          description: TOTP disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the current user (newest first)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a single notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not your notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark every unread notification for the current user as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Count of updated rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                required: [updated]
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reviews:
    post:
      operationId: createReview
      tags: [reviews]
      summary: Customer leaves a 1–5 star review for a completed booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingReview"
        "400":
          description: Invalid input or booking is not completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not your booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Booking has already been reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}/review:
    get:
      operationId: getBookingReview
      tags: [reviews]
      summary: Fetch the review attached to a booking, if any
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review for this booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingReview"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not your booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Booking or review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/push-token:
    put:
      operationId: registerPushToken
      tags: [notifications]
      summary: Store/clear the current user's Expo push token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenRequest"
      responses:
        "204":
          description: Stored
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/biz-account:
    get:
      operationId: getMyBizAccount
      tags: [auth]
      summary: Authenticated SP reads their own biz_account status/meeting snapshot
      description: |
        Business-role only. Returns the same minimal snapshot as the public status
        endpoint (status, paidAt, meeting time/location/duration) for the caller's
        own application, resolved from the auth token's businessId. Used by the
        provider dashboard to surface a still-upcoming meeting after login.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BizAccountStatusResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — caller is not a service provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Biz account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/subscription:
    get:
      operationId: getMySubscription
      tags: [subscriptions]
      summary: Get the SP's current subscription state, plan limits, and a Stripe billing-portal URL
      description: |
        Authenticated SP only. Returns the plan tier, whether the subscription is currently entitling
        the SP to perks, current usage vs the plan's service-count cap, and (when a Stripe customer
        exists) a one-shot billing-portal URL the mobile client can open to manage payment methods,
        view invoices, or cancel.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySubscriptionResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — caller is not a service provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/subscription/checkout:
    post:
      operationId: createMySubscriptionCheckout
      tags: [subscriptions]
      summary: Start a Stripe Checkout session to subscribe to (or upgrade/downgrade) a plan
      description: |
        Authenticated SP only. Looks up the live Stripe price for the requested plan tier from the
        sync'd `stripe.products` table, creates (or reuses) a Stripe customer for the SP, and
        returns a hosted Checkout URL the mobile app can open via WebBrowser.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionCheckoutRequest"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCheckoutResponse"
        "400":
          description: Bad request (unknown plan or missing Stripe price)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — caller is not a service provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/stripe/connect/account:
    get:
      operationId: getMyStripeConnectAccount
      tags: [stripeConnect]
      summary: Get the SP's Stripe Connect Express account state
      description: |
        Authenticated SP only. Returns the current Connect account id (or null if
        onboarding has never been started), a high-level status, the live
        charges/payouts flags, and any requirements Stripe is currently asking
        the SP to satisfy. Re-fetches from Stripe on every call so the UI
        reflects reality without waiting on the account.updated webhook.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connect account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeConnectAccountResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — caller is not a service provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMyStripeConnectAccount
      tags: [stripeConnect]
      summary: Ensure a Stripe Connect Express account exists for the SP
      description: |
        Authenticated SP only. Idempotent: if `stripeAccountId` is already set
        on the business, returns the existing account state refreshed from
        Stripe. Otherwise creates a new Express account, persists the id, and
        returns the initial state (charges/payouts disabled until onboarding
        completes).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connect account ensured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeConnectAccountResponse"
        "400":
          description: Bad request (e.g. missing email on file)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — caller is not a service provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/stripe/connect/onboarding-link:
    post:
      operationId: createMyStripeConnectOnboardingLink
      tags: [stripeConnect]
      summary: Mint a hosted Stripe Express onboarding URL for the SP
      description: |
        Authenticated SP only. Auto-creates the Connect account if missing.
        Returns a one-shot URL that the mobile client opens via WebBrowser; the
        URL expires ~5 minutes after creation. After the SP completes (or
        cancels) the form, Stripe redirects to a static "you can close this
        window" page on the API server, and mobile re-fetches account state.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeConnectOnboardingLinkResponse"
        "400":
          description: Bad request (missing email on file)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — caller is not a service provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/earnings:
    get:
      operationId: getMyEarnings
      tags: [stripeConnect]
      summary: SP earnings dashboard (lifetime + 30-day rollup, Stripe pending balance, recent payments)
      description: |
        Authenticated SP only. Aggregates the caller's paid bookings (those
        with a `paymentIntentId`) into lifetime + 30-day buckets, fetches the
        SP's Stripe Connect balance, and returns the 25 most-recent paid
        bookings. All money fields are integer USD cents. `balance` is null
        when the SP has not finished Connect onboarding or Stripe is
        temporarily unreachable.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Earnings dashboard payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarningsResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — caller is not a service provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/earnings/export.csv:
    get:
      operationId: exportMyEarningsCsv
      tags: [stripeConnect]
      summary: Download every paid booking as CSV
      description: |
        Authenticated SP only. Returns text/csv with one row per paid
        booking, newest first, with USD dollar columns suitable for direct
        import into Excel/Google Sheets.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: CSV download
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — caller is not a service provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}/messages:
    get:
      operationId: listBookingMessages
      tags: [messages]
      summary: List the chat thread for a booking (oldest first)
      description: |
        Returns every message on the per-booking thread, oldest first.
        Authz: caller must be the booking's customer OR the SP that owns the
        business. Optional `?after=<ISO timestamp>` returns only messages
        strictly newer than that timestamp (used by mobile polling).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden — not a participant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Booking not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: sendBookingMessage
      tags: [messages]
      summary: Append a message to the thread
      description: |
        Appends one message to the booking's thread and notifies the other
        participant (in-app + Expo push when available). Body trimmed and
        capped at 2000 characters.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Empty or oversized body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden — not a participant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Booking not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /bookings/{id}/messages/read:
    post:
      operationId: markBookingMessagesRead
      tags: [messages]
      summary: Mark every message from the OTHER party as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Count of rows marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                required: [updated]
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden — not a participant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Booking not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /me/conversations:
    get:
      operationId: listMyConversations
      tags: [messages]
      summary: List every booking the caller has a thread for, with last-message preview + unread count
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden — admin tokens have no conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /me/calendar:
    get:
      operationId: getMyCalendar
      tags: [calendar]
      summary: SP fetches their iCal feed URL + external calendar sync state
      description: |
        Authenticated SP only. Returns the SP's outbound iCal feed URL
        (null if no token has been minted yet) plus the inbound external
        calendar URL, last sync timestamp, and last sync error if any.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Calendar sync settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCalendarResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden — caller is not an SP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /me/calendar/regenerate:
    post:
      operationId: regenerateMyCalendarToken
      tags: [calendar]
      summary: Mint a fresh iCal token (invalidates the previous feed URL)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New feed URL
          content:
            application/json:
              schema:
                type: object
                required: [feedUrl]
                properties:
                  feedUrl: { type: string, format: uri }
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden — caller is not an SP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /me/calendar/external:
    put:
      operationId: setMyExternalCalendar
      tags: [calendar]
      summary: Save the inbound iCal URL the SP wants pulled in as blocked time
      description: HTTPS or webcal URLs only. Does NOT trigger a sync — call POST /me/calendar/external/sync next.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMyExternalCalendarRequest"
      responses:
        "204": { description: Saved }
        "400":
          description: Invalid URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden — caller is not an SP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteMyExternalCalendar
      tags: [calendar]
      summary: Clear the inbound URL and remove all imported blocked slots
      security:
        - bearerAuth: []
      responses:
        "204": { description: Cleared }
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden — caller is not an SP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /me/calendar/external/sync:
    post:
      operationId: syncMyExternalCalendar
      tags: [calendar]
      summary: Fetch + parse the inbound URL and replace all imported blocks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sync complete
          content:
            application/json:
              schema:
                type: object
                required: [importedBlocks, syncedAt]
                properties:
                  importedBlocks: { type: integer }
                  syncedAt: { type: string, format: date-time }
        "400":
          description: No external URL configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden — caller is not an SP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: External calendar fetch or parse failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /me/business:
    patch:
      operationId: updateMyBusiness
      tags: [scheduling]
      summary: SP edits their own business profile (hours, contact, vacation mode)
      description: |
        Authenticated SP only. Partial update — only fields explicitly sent are
        modified. Vacation fields must be sent together (`vacationFrom` +
        `vacationUntil` both set) to enable, or both `null` to clear. Hours
        validation requires endHour > startHour.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyBusinessRequest"
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — caller is not an SP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Business no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /biz-accounts:
    get:
      operationId: listBizAccounts
      tags: [auth]
      summary: Admin lists biz_account applications, optionally filtered by status
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [awaiting_payment, pending, accepted, approved, rejected]
      responses:
        "200":
          description: Biz accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BizAccount"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createBizAccount
      tags: [auth]
      summary: SP applies (public — no auth). Creates user + biz_account in awaiting_payment state and a Stripe Checkout Session for the configured application fee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBizAccountRequest"
      responses:
        "201":
          description: Application created and checkout session ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBizAccountResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use or the displayed application fee is no longer current
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Stripe Checkout Session could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /application-fees:
    get:
      operationId: getApplicationFees
      tags: [auth]
      summary: Public configured one-time provider fees, shared with Stripe Checkout.
      responses:
        "200":
          description: Current non-refundable fees in integer cents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationFees"

  /biz-accounts/{id}/status:
    get:
      operationId: getBizAccountStatus
      tags: [auth]
      summary: Public status check used by the payment-return screen to poll for the webhook flip from awaiting_payment → pending.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BizAccountStatusResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /biz-accounts/{id}/approve:
    post:
      operationId: approveBizAccount
      tags: [auth]
      summary: Admin finalizes an accepted application — creates the public businesses row and flips status to approved (override; the $60 onboarding payment normally does this automatically).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveBizAccountRequest"
      responses:
        "200":
          description: Approved; biz_account flipped + businesses row created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveBizAccountResult"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Application not in `accepted` state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /biz-accounts/{id}/accept:
    post:
      operationId: acceptBizAccount
      tags: [auth]
      summary: Admin accepts a paid application after the interview — moves it to `accepted` so the applicant can pay the onboarding fee.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BizAccount"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Application not in `pending` state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /biz-accounts/{id}/onboarding-checkout:
    post:
      operationId: createOnboardingCheckout
      tags: [auth]
      summary: Create a Stripe Checkout Session for the configured onboarding fee. Public — the application id acts as a capability token.
      description: Send the onboarding amount displayed to the applicant. If it differs from current configuration, refresh application-fees and require another deliberate payment click; never automatically retry checkout.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingCheckoutInput"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingCheckoutResponse"
        "400":
          description: Invalid expected onboarding amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Application not accepted, or the displayed onboarding fee has changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Could not create Stripe session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Checkout is temporarily busy or Stripe timed out. Wait before deliberately retrying; the same attempt is reused.
          headers:
            Retry-After:
              description: Minimum wait before retrying, in seconds
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /biz-accounts/{id}/reject:
    post:
      operationId: rejectBizAccount
      tags: [auth]
      summary: Admin rejects an application — non-refunding (the $19 application fee is retained).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectBizAccountRequest"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BizAccount"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /biz-accounts/{id}:
    patch:
      operationId: updateBizAccount
      tags: [auth]
      summary: Admin changes status, or SP edits own profile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBizAccountRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BizAccount"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    AdminMetricsTierBucket:
      type: object
      properties:
        count: { type: integer }
        mrrCents: { type: integer }
      required: [count, mrrCents]

    AdminAuditLogEntry:
      type: object
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actorId: { type: string, nullable: true }
        actorRole: { type: string, nullable: true }
        actorLabel: { type: string, nullable: true }
        entityType:
          type: string
          enum: [service, service_option, booking, biz_account, business]
        entityId: { type: string }
        action: { type: string }
        summary: { type: string }
        metadata:
          type: object
          additionalProperties: true
          nullable: true
      required: [id, at, actorId, actorRole, actorLabel, entityType, entityId, action, summary, metadata]

    AdminAuditLogResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuditLogEntry"
      required: [entries]

    AdminStripePaymentReview:
      type: object
      description: Read-only Stripe review links. Null URLs mean the stored event cannot safely establish the Stripe mode or session.
      properties:
        mode:
          type: [string, "null"]
          enum: [test, live, null]
        originalSessionId: { type: string }
        extraSessionId: { type: string }
        originalDashboardUrl: { type: [string, "null"] }
        extraDashboardUrl: { type: [string, "null"] }
      required: [mode, originalSessionId, extraSessionId, originalDashboardUrl, extraDashboardUrl]

    AdminStripeManualReviewInput:
      type: object
      additionalProperties: false
      properties:
        outcome:
          type: string
          enum: [needs_follow_up, no_action_needed, handled_in_stripe]
        note:
          type: string
          maxLength: 500
          description: Optional non-sensitive operational note. No card details, credentials, or personal information.
      required: [outcome]

    AdminStripeManualReview:
      type: object
      properties:
        id: { type: string }
        outcome:
          type: string
          enum: [needs_follow_up, no_action_needed, handled_in_stripe]
        reviewerId: { type: string }
        reviewerName: { type: string }
        reviewedAt: { type: string, format: date-time }
        note: { type: [string, "null"] }
      required: [id, outcome, reviewerId, reviewerName, reviewedAt, note]

    AdminStripeWebhookDeadLetterEntry:
      type: object
      properties:
        id: { type: string }
        eventId: { type: string }
        eventType: { type: string }
        handlerName:
          type: string
          enum: [subscription_mirror, connect_mirror, pi_succeeded, pi_failed, dispute, biz_account_paid]
        status:
          type: string
          enum: [pending, resolved, ignored]
        attempts: { type: integer }
        lastError: { type: string }
        paymentReview:
          $ref: "#/components/schemas/AdminStripePaymentReview"
        manualReviews:
          type: array
          description: Append-only manual review history, newest first. Empty means no recorded review, including historical dismissals.
          items:
            $ref: "#/components/schemas/AdminStripeManualReview"
        lastAttemptAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        resolvedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, eventId, eventType, handlerName, status, attempts, lastError, manualReviews, lastAttemptAt, createdAt, resolvedAt]

    AdminStripeWebhookDeadLetterResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AdminStripeWebhookDeadLetterEntry"
      required: [entries]

    AdminEmailOutboxEntry:
      type: object
      properties:
        id: { type: string }
        toEmail: { type: string }
        subject: { type: string }
        kind: { type: string }
        status:
          type: string
          enum: [pending, sent, failed, dismissed]
        attempts: { type: integer }
        lastError:
          type: string
          nullable: true
        nextAttemptAt: { type: string, format: date-time }
        sentAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
      required: [id, toEmail, subject, kind, status, attempts, lastError, nextAttemptAt, sentAt, createdAt]

    AdminEmailOutboxResponse:
      type: object
      properties:
        entries:
          type: array
          items:
