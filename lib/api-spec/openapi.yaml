openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AKODD marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication for customers, service providers, and admin
  - name: catalog
    description: Categories, businesses, services (read-only catalog)
  - name: bookings
    description: Customer/business bookings
  - name: scheduling
    description: Blocked slots and live availability
  - name: notifications
    description: In-app notification feed and Expo push token registration
  - name: subscriptions
    description: Service-provider subscription plans (Basic/Pro/Premium) and Stripe Checkout
  - name: messages
    description: Per-booking customer ↔ SP chat threads
  - name: calendar
  - name: admin
    description: SP iCal feed export and external calendar import (Phase 3 #8)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List all categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /businesses:
    get:
      operationId: listBusinesses
      tags: [catalog]
      summary: List businesses
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"

  /businesses/{id}:
    get:
      operationId: getBusiness
      tags: [catalog]
      summary: Get a business by id (with employees)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services:
    get:
      operationId: listServices
      tags: [catalog]
      summary: List services
      parameters:
        - name: businessId
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          description: Free-text search over service title, business name, and tags.
          schema:
            type: string
        - name: minRating
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 5
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: sort
          in: query
          required: false
          description: Sort order. Default `relevance` ranks featured first then by rating.
          schema:
            type: string
            enum: [relevance, rating, price_asc, price_desc]
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [catalog]
      summary: SP creates a new service for their business
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services/{id}:
    get:
      operationId: getService
      tags: [catalog]
      summary: Get a service by id (with options + reviews)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Service detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateService
      tags: [catalog]
      summary: SP edits one of their services
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteService
      tags: [catalog]
      summary: SP deletes one of their services
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services/{id}/options:
    post:
      operationId: createServiceOption
      tags: [catalog]
      summary: SP adds a pricing option to one of their services
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceOptionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOption"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /service-options/{id}:
    patch:
      operationId: updateServiceOption
      tags: [catalog]
      summary: SP edits one of their service options
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceOptionRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOption"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Option not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteServiceOption
      tags: [catalog]
      summary: SP deletes one of their service options
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Option not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings filtered by customer or business
      security:
        - bearerAuth: []
      parameters:
        - name: customerId
          in: query
          required: false
          schema:
            type: string
        - name: businessId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Customer creates a booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Service or option not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/payment-intent:
    post:
      operationId: createBookingPaymentIntent
      tags: [bookings]
      summary: Create a draft booking and a Stripe destination-charge PaymentIntent
      description: |
        Creates a `pending` booking row and a PaymentIntent with
        `transfer_data.destination` set to the SP's Connect account and
        `application_fee_amount` set to the 8% platform fee. Returns the
        `client_secret` so the mobile client can present Stripe PaymentSheet.

        Fails with 409 (`reason: provider_not_payable`) if the target
        provider has not finished Stripe Connect onboarding.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: PaymentIntent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBookingPaymentIntentResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Service or option not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Provider not payable (Connect onboarding incomplete)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}/refund:
    post:
      operationId: refundBooking
      tags: [bookings]
      summary: Refund a paid booking in full (admin or owning SP)
      description: |
        Issues a Stripe refund with `reverse_transfer` and
        `refund_application_fee` so customer, SP, and platform all return to
        zero. Marks the booking `cancelled` and notifies the customer.
        Idempotent — calling on an already-refunded booking returns the
        existing refund id.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Refund completed (or already done)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRefundResult"
        "400":
          description: Booking has no payment to refund
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Stripe refund failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}/refund-request:
    post:
      operationId: requestBookingRefund
      tags: [bookings]
      summary: Customer asks for a refund on their booking (Phase 3 #2)
      description: |
        Customer-only. Stamps `refundRequestedAt`/`refundReason` on the
        booking and notifies all admins + the SP owner. Eligibility: caller
        owns the booking, it was paid (`paymentIntentId` set), not yet
        refunded, no existing pending request, and status is `confirmed` or
        `completed`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequestBody"
      responses:
        "201":
          description: Refund request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundRequestResult"
        "400":
          description: Booking not eligible (unpaid, wrong status, already refunded)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Unauthenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Forbidden (not the booking's customer)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Booking not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: A refund request is already on file, or a card dispute is open on this booking
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /bookings/{id}/refund-request/decide:
    post:
      operationId: decideBookingRefundRequest
      tags: [bookings]
      summary: Admin approves or denies a customer's refund request (Phase 3 #2)
      description: |
        Admin-only. Approval funnels through the same Stripe refund path as
        `POST /bookings/{id}/refund` (full refund, status='cancelled',
        notifies the customer). Denial just stamps the decision fields and
        notifies the customer with the admin's reason.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundDecideBody"
      responses:
        "200":
          description: Decision recorded (refund executed if approved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundDecideResult"
        "400":
          description: No request on file, or invalid body
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Unauthenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Not an admin
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Booking not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Request already decided
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "502":
          description: Stripe refund failed (approval path only)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /admin/metrics:
    get:
      operationId: getAdminMetrics
      tags: [admin]
      summary: Operational metrics for the platform owner (Phase 3 #9)
      description: GMV, MRR by tier, conversion funnel, churn snapshot, and top categories. All money in integer cents.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Metrics payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMetrics"
        "401": { description: Unauthenticated }
        "403": { description: Not an admin }

  /admin/audit-log:
    get:
      operationId: getAdminAuditLog
      tags: [admin]
      summary: Recent audit-log entries (Phase 3 #10)
      description: |
        Returns the most recent rows from `audit_log`, newest first. Optionally filter
        by `entityType` and/or `entityId` to scope the feed to a single entity's history.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: entityType
          in: query
          required: false
          schema:
            type: string
            enum: [service, service_option, booking, biz_account, business]
        - name: entityId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Audit-log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogResponse"
        "401": { description: Unauthenticated }
        "403": { description: Not an admin }

  /admin/stripe-webhook-dead-letter:
    get:
      operationId: getAdminStripeWebhookDeadLetter
      tags: [admin]
      summary: Stripe webhook dead-letter queue (TD-3)
      description: |
        Returns Stripe webhook events whose handler threw. Each row stores the
        full `Stripe.Event` payload so it can be replayed without asking
        Stripe to redeliver. Filterable by status (default `pending`).
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, resolved, ignored, all]
            default: pending
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Dead-letter entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStripeWebhookDeadLetterResponse"
        "401": { description: Unauthenticated }
        "403": { description: Not an admin }

  /admin/stripe-webhook-dead-letter/{id}/retry:
    post:
      operationId: retryAdminStripeWebhookDeadLetter
      tags: [admin]
      summary: Re-dispatch a dead-letter event (TD-3)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Replay succeeded; row marked resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string }
                required: [ok, status]
        "404": { description: Not found }
        "409": { description: Already resolved }
        "500":
          description: Replay failed; row stays pending with updated lastError
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  error: { type: string }
                required: [ok, error]

  /admin/stripe-webhook-dead-letter/{id}/ignore:
    post:
      operationId: ignoreAdminStripeWebhookDeadLetter
      tags: [admin]
      summary: Mark a dead-letter row as ignored (TD-3)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Row marked ignored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string }
                required: [ok, status]
        "404": { description: Not found }
        "409": { description: Already resolved }

  /admin/stripe-webhook-dead-letter/{id}/reviews:
    post:
      operationId: recordAdminStripePaymentReview
      tags: [admin]
      summary: Append an admin manual review without changing queue or payment state
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStripeManualReviewInput"
      responses:
        "201":
          description: Immutable review recorded with server-derived reviewer and time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStripeManualReview"
        "400": { description: "Invalid outcome or note, or not a duplicate payment" }
        "401": { description: Unauthenticated }
        "403": { description: Not an admin }
        "404": { description: Entry not found }

  /admin/email-outbox:
    get:
      operationId: getAdminEmailOutbox
      tags: [admin]
      summary: Email outbox — provider notification emails with retry state (Task 7)
      description: |
        Every provider notification email is persisted here before the first
        send attempt. Failed sends are retried automatically with backoff;
        after the attempt budget is exhausted the row becomes `failed`.
        Filterable by status (default `failed`). Bodies are not returned.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, sent, failed, dismissed, all]
            default: failed
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Outbox entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEmailOutboxResponse"
        "401": { description: Unauthenticated }
        "403": { description: Not an admin }

  /admin/email-outbox/{id}/retry:
    post:
      operationId: retryAdminEmailOutbox
      tags: [admin]
      summary: Retry a failed/pending outbox email immediately (Task 7)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Send succeeded; row marked sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string }
                required: [ok, status]
        "404": { description: Not found }
        "409": { description: Not retryable (already sent/dismissed) }
        "502":
          description: Send failed again; row keeps updated lastError
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  error: { type: string }
                required: [ok, error]

  /admin/email-outbox/{id}/dismiss:
    post:
      operationId: dismissAdminEmailOutbox
      tags: [admin]
      summary: Dismiss a failed outbox email so it is no longer retried (Task 7)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Row marked dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string }
                required: [ok, status]
        "404": { description: Not found }
        "409": { description: Already sent or dismissed }

  /admin/refund-requests:
    get:
      operationId: listPendingRefundRequests
      tags: [admin]
      summary: Admin queue of pending refund requests (Phase 3 #2)
      description: Returns booking rows with an open refund request — `refundRequestedAt` set and `refundDecision` null.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending refund requests, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          description: Unauthenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Not an admin
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /bookings/{id}/cancellation-quote:
    get:
      operationId: getCancellationQuote
      tags: [bookings]
      summary: Preview the refund a customer would get if they cancelled this booking now
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancellation quote (or terminal-state notice)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationQuote"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — booking is not yours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}:
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update a booking's status (customer cancels, SP confirms/completes/cancels, admin any)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingStatusRequest"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Illegal status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /blocked-slots:
    get:
      operationId: listBlockedSlots
      tags: [scheduling]
      summary: List blocked slots for a business in a date range
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive YYYY-MM-DD
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: Inclusive YYYY-MM-DD
          schema:
            type: string
      responses:
        "200":
          description: Blocked slots
