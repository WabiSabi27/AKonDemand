            type: integer
        startHour: { type: integer }
        endHour: { type: integer }
      required: [workDays, startHour, endHour]

    BusinessEmployee:
      type: object
      properties:
        id: { type: integer }
        specialty:
          type: string
          nullable: true
      required: [id]

    Business:
      type: object
      properties:
        id: { type: string }
        ownerId: { type: string }
        name: { type: string }
        description: { type: string }
        categoryId: { type: string }
        logoUrl:
          type: string
          nullable: true
        coverUrl:
          type: string
          nullable: true
        rating:
          type: string
          description: Decimal as string
        reviewCount: { type: integer }
        subscriptionActive: { type: boolean }
        subscriptionPlan:
          $ref: "#/components/schemas/PlanTier"
        phone: { type: string }
        location: { type: string }
        joinedDate: { type: string }
        serviceCount: { type: integer }
        hours:
          oneOf:
            - $ref: "#/components/schemas/BusinessHours"
            - type: "null"
        employees:
          type: array
          description: Always populated on both list and detail responses (eager join).
          items:
            $ref: "#/components/schemas/BusinessEmployee"
        stripeAccountStatus:
          type: string
          enum: [none, pending, active, restricted]
          description: |
            Mirror of the SP's Stripe Connect account status. Customers can
            only book when this is `active` AND `stripePayoutsEnabled` is true.
        stripePayoutsEnabled:
          type: boolean
          description: |
            Mirror of `account.payouts_enabled` from Stripe. Drives the
            customer-facing "Book Now" gate — bookings cannot create a
            PaymentIntent when this is false.
        vacationFrom:
          type: string
          nullable: true
          description: "Start of vacation/OOO window (YYYY-MM-DD), inclusive."
        vacationUntil:
          type: string
          nullable: true
          description: "End of vacation/OOO window (YYYY-MM-DD), inclusive."
        vacationMessage:
          type: string
          nullable: true
          description: "Optional message shown to customers when booking is blocked by vacation."
        cancellationFullRefundHours:
          type: integer
          minimum: 0
          maximum: 720
          description: |
            Cancellation policy — customer gets a 100% refund if they cancel
            this many hours or more before the scheduled time. (Phase 3 #7.)
        cancellationPartialRefundHours:
          type: integer
          minimum: 0
          maximum: 720
          description: |
            Cancellation policy — customer gets `cancellationPartialRefundPercent`%
            refund if they cancel within (`cancellationFullRefundHours` ..
            `cancellationPartialRefundHours`] hours of the scheduled time.
            Inside this window: no refund.
        cancellationPartialRefundPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Partial-refund tier percentage (0–100).
      required:
        - id
        - ownerId
        - name
        - description
        - categoryId
        - rating
        - reviewCount
        - subscriptionActive
        - subscriptionPlan
        - employees
        - phone
        - location
        - joinedDate
        - serviceCount
        - stripeAccountStatus
        - stripePayoutsEnabled
        - cancellationFullRefundHours
        - cancellationPartialRefundHours
        - cancellationPartialRefundPercent

    BusinessDetail:
      allOf:
        - $ref: "#/components/schemas/Business"
        - type: object
          properties:
            employees:
              type: array
              items:
                $ref: "#/components/schemas/BusinessEmployee"
          required: [employees]

    Service:
      type: object
      properties:
        id: { type: string }
        businessId: { type: string }
        businessName: { type: string }
        categoryId: { type: string }
        title: { type: string }
        description: { type: string }
        rating:
          type: string
          description: Decimal as string
        reviewCount: { type: integer }
        startingPrice:
          type: string
          description: Decimal as string
        tags:
          type: array
          items:
            type: string
        featured: { type: boolean }
        requiredSpecialty:
          type: string
          nullable: true
        options:
          type: array
          description: Always populated on both list and detail responses (eager join).
          items:
            $ref: "#/components/schemas/ServiceOption"
      required:
        - id
        - businessId
        - businessName
        - categoryId
        - title
        - description
        - rating
        - reviewCount
        - startingPrice
        - tags
        - featured
        - options

    ServiceOption:
      type: object
      properties:
        id: { type: string }
        serviceId: { type: string }
        name: { type: string }
        description: { type: string }
        price:
          type: string
          description: Decimal as string
        duration: { type: string }
        defaultStartTime:
          type: string
          nullable: true
          description: >-
            For long-duration options (full-day / 8h+) the SP may pin the single
            HH:MM (24h) start time customers can book at. Null = no override;
            the standard 30-minute slot grid is used.
      required: [id, serviceId, name, description, price, duration]

    ServiceReview:
      type: object
      properties:
        id: { type: string }
        serviceId: { type: string }
        authorName: { type: string }
        rating: { type: integer }
        comment: { type: string }
        date: { type: string }
      required: [id, serviceId, authorName, rating, comment, date]

    BookingReview:
      type: object
      properties:
        id: { type: string }
        bookingId: { type: string }
        customerId: { type: string }
        customerName: { type: string }
        serviceId: { type: string }
        businessId: { type: string }
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment: { type: string }
        createdAt:
          type: string
          format: date-time
      required: [id, bookingId, customerId, customerName, serviceId, businessId, rating, comment, createdAt]

    CreateReviewRequest:
      type: object
      properties:
        bookingId: { type: string }
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
      required: [bookingId, rating]

    ServiceDetail:
      allOf:
        - $ref: "#/components/schemas/Service"
        - type: object
          properties:
            options:
              type: array
              items:
                $ref: "#/components/schemas/ServiceOption"
            reviews:
              type: array
              items:
                $ref: "#/components/schemas/ServiceReview"
          required: [options, reviews]

    Booking:
      type: object
      properties:
        id: { type: string }
        customerId: { type: string }
        customerName: { type: string }
        serviceId: { type: string }
        businessId: { type: string }
        businessName: { type: string }
        serviceTitle: { type: string }
        optionName: { type: string }
        price:
          type: string
          description: Decimal as string
        platformFee:
          type: string
          description: Decimal as string
        total:
          type: string
          description: Decimal as string
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
        scheduledDate: { type: string, description: "YYYY-MM-DD" }
        scheduledTime:
          type: string
          nullable: true
          description: "HH:MM 24h"
        durationMinutes:
          type: integer
          nullable: true
        paymentIntentId:
          type: string
          nullable: true
          description: Stripe PaymentIntent id that funded this booking; null for legacy/free bookings.
        refundId:
          type: string
          nullable: true
          description: Stripe Refund id; set when the booking was refunded.
        refundedAt:
          type: string
          format: date-time
          nullable: true
          description: When the booking was refunded; null otherwise.
        refundRequestedAt:
          type: string
          format: date-time
          nullable: true
          description: Phase 3 #2 — when the customer asked for a refund; null if no request.
        refundReason:
          type: string
          nullable: true
          description: Customer's stated reason for requesting a refund.
        refundDecision:
          type: string
          enum: [approved, denied]
          nullable: true
          description: Admin's decision on the refund request; null while pending.
        refundDecidedAt:
          type: string
          format: date-time
          nullable: true
        refundDecisionReason:
          type: string
          nullable: true
          description: Admin's note. Required for denials, optional for approvals.
        disputeId:
          type: string
          nullable: true
          description: Stripe `dp_…` id when the cardholder filed a chargeback.
        disputeStatus:
          type: string
          nullable: true
          description: Latest Stripe dispute.status (warning_needs_response, needs_response, won, lost, etc.).
        disputeCreatedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        reviewed:
          type: boolean
          description: True when the customer has already submitted a review for this booking.
        cancellationFullRefundHours:
          type: integer
          nullable: true
          description: |
            Snapshot of the SP's `cancellationFullRefundHours` at the time
            this booking was created. Null on legacy bookings predating the
            cancellation-policy feature; in that case the resolver falls
            back to the business's live policy.
        cancellationPartialRefundHours:
          type: integer
          nullable: true
          description: Snapshot of `cancellationPartialRefundHours` at booking time.
        cancellationPartialRefundPercent:
          type: integer
          nullable: true
          description: Snapshot of `cancellationPartialRefundPercent` at booking time.
        cancellationRefundCents:
          type: integer
          nullable: true
          description: |
            When the customer cancels under the policy, this records the
            cents amount they actually received back. 0 means policy was
            applied but the cancellation fell inside the no-refund window.
            Null means the booking was cancelled by SP/admin (separate
            refund flow) or hasn't been cancelled yet.
      required:
        - id
        - customerId
        - customerName
        - serviceId
        - businessId
        - businessName
        - serviceTitle
        - optionName
        - price
        - platformFee
        - total
        - status
        - scheduledDate
        - createdAt
        - reviewed

    RefundRequestBody:
      type: object
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 1000
          description: Customer's stated reason for the refund (10-1000 chars).
      required: [reason]

    RefundRequestResult:
      type: object
      description: Returned by POST /bookings/{id}/refund-request.
      properties:
        bookingId: { type: string }
        refundRequestedAt: { type: string, format: date-time }
        refundReason: { type: string }
      required: [bookingId, refundRequestedAt, refundReason]

    RefundDecideBody:
      type: object
      description: |
        Admin's decision on a refund request. `reason` is required when
        denying (≥ 5 chars), optional when approving.
      properties:
        decision:
          type: string
          enum: [approved, denied]
        reason:
          type: string
          maxLength: 1000
      required: [decision]

    RefundDecideResult:
      type: object
      properties:
        bookingId: { type: string }
        decision:
          type: string
          enum: [approved, denied]
        decidedAt: { type: string, format: date-time }
        refundId:
          type: string
          description: Set when decision=approved (Stripe `re_…`).
        refundedAt:
          type: string
          format: date-time
          description: Set when decision=approved.
        reason:
          type: string
          description: Set when decision=denied (the admin's denial explanation).
      required: [bookingId, decision, decidedAt]

    CreateBookingPaymentIntentResponse:
      type: object
      description: |
        Returned by POST /bookings/payment-intent. Mobile uses
        `clientSecret` to confirm via Stripe PaymentSheet, then refreshes
        the bookings list (the row is already in `pending`).
      properties:
        bookingId: { type: string }
        paymentIntentId: { type: string }
        clientSecret:
          type: string
          description: Stripe PaymentIntent client_secret for PaymentSheet.
        customerId:
          type: string
          description: Stripe Customer id created/reused for this user.
        stripeAccountId:
          type: string
          description: SP's Connect account that will receive the destination transfer.
      required: [bookingId, paymentIntentId, clientSecret, customerId, stripeAccountId]

    BookingRefundResult:
      type: object
      description: Returned by POST /bookings/{id}/refund.
      properties:
        bookingId: { type: string }
        refundId: { type: string }
        refundedAt:
          type: string
          format: date-time
          nullable: true
        alreadyRefunded:
          type: boolean
          description: True when the booking was already refunded prior to this call.
      required: [bookingId, refundId, alreadyRefunded]

    BlockedSlot:
      type: object
      properties:
        id: { type: string }
        businessId: { type: string }
        date: { type: string, description: "YYYY-MM-DD" }
        allDay: { type: boolean }
        startTime:
          type: string
          nullable: true
        endTime:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
      required: [id, businessId, date, allDay]

    AvailabilitySlot:
      type: object
      properties:
        time:
          type: string
          description: "HH:MM 24h"
        available: { type: boolean }
        remaining:
          type: integer
          description: Seats still open at this slot (0 when blocked or fully booked).
        reason:
          type: string
          nullable: true
          description: e.g. "fully booked", "blocked"
      required: [time, available, remaining]

    Availability:
      type: object
      properties:
        serviceId: { type: string }
        date: { type: string, description: "YYYY-MM-DD" }
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlot"
        capacity:
          type: integer
          description: Concurrent bookings the business can handle (employee count, min 1)
        vacation:
          nullable: true
          description: |
            Populated when the requested date falls inside the SP's vacation
            window. When non-null, `slots` will be empty and the client should
            render an OOO banner using `message` (or a default if null).
          type: object
          properties:
            active: { type: boolean }
            from: { type: string, description: "YYYY-MM-DD" }
            until: { type: string, description: "YYYY-MM-DD" }
            message:
              type: string
              nullable: true
          required: [active, from, until]
      required: [serviceId, date, slots, capacity]

    # ----- Write request payloads (T005) -----

    CreateBookingRequest:
      type: object
      properties:
        serviceId: { type: string }
        optionId: { type: string }
        scheduledDate: { type: string, description: "YYYY-MM-DD" }
        scheduledTime:
          type: string
          nullable: true
          description: "HH:MM 24h"
      required: [serviceId, optionId, scheduledDate]

    UpdateBookingStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
      required: [status]

    UpdateMyBusinessRequest:
      type: object
      description: |
        Partial update for the SP's own business. Only fields the client sends
        are touched. Vacation fields must be sent as a pair (both strings to
        enable, both null to clear).
      properties:
        hours:
          oneOf:
            - $ref: "#/components/schemas/BusinessHours"
            - type: "null"
        phone:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        vacationFrom:
          type: string
          nullable: true
          description: "YYYY-MM-DD, inclusive start of OOO window."
        vacationUntil:
          type: string
          nullable: true
          description: "YYYY-MM-DD, inclusive end of OOO window."
        vacationMessage:
          type: string
          nullable: true
        cancellationFullRefundHours:
          type: integer
          minimum: 0
          maximum: 720
        cancellationPartialRefundHours:
          type: integer
          minimum: 0
          maximum: 720
        cancellationPartialRefundPercent:
          type: integer
          minimum: 0
          maximum: 100

    CancellationPolicy:
      type: object
      properties:
        fullRefundHours: { type: integer }
        partialRefundHours: { type: integer }
        partialRefundPercent: { type: integer }
      required: [fullRefundHours, partialRefundHours, partialRefundPercent]

    CancellationQuote:
      type: object
      description: |
        Preview of the refund a customer would receive if they cancelled
        this booking right now. Returned by GET /bookings/{id}/cancellation-quote.
        `eligible:false` means the booking is in a terminal state — render
        the policy as info but do not show a confirm-cancel CTA.
      properties:
        eligible: { type: boolean }
        reason:
          type: string
          nullable: true
          enum: [already_cancelled, already_completed, null]
          description: Why the booking can't be cancelled, when eligible=false.
        refundCents: { type: integer }
        tier:
          type: string
          enum: [full, partial, none]
        hoursUntilScheduled: { type: number }
        totalCents: { type: integer }
        paid:
          type: boolean
          nullable: true
          description: True when the booking has a paymentIntent (refund flow can run).
        policy:
          $ref: "#/components/schemas/CancellationPolicy"
      required: [eligible, refundCents, tier, hoursUntilScheduled, totalCents, policy]

    CreateBlockedSlotRequest:
      type: object
      properties:
        date: { type: string, description: "YYYY-MM-DD" }
        allDay: { type: boolean }
        startTime:
          type: string
          nullable: true
          description: "HH:MM 24h"
        endTime:
          type: string
          nullable: true
          description: "HH:MM 24h"
        label:
          type: string
          nullable: true
      required: [date, allDay]

    CreateServiceRequest:
      type: object
      properties:
        categoryId: { type: string }
        title: { type: string }
        description:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
          nullable: true
        requiredSpecialty:
          type: string
          nullable: true
        featured:
          type: boolean
          nullable: true
        options:
          type: array
          nullable: true
          description: >-
            Optional inline options. When present they are inserted in the same
            transaction as the service and `startingPrice` is recomputed from
            their prices.
          items:
            $ref: "#/components/schemas/CreateServiceOptionRequest"
      required: [categoryId, title]

    UpdateServiceRequest:
      type: object
      properties:
        categoryId:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
          nullable: true
        requiredSpecialty:
          type: string
          nullable: true
        featured:
          type: boolean
          nullable: true
        options:
          type: array
          nullable: true
          description: >-
            Optional full replacement of this service's options. When provided
            (even as an empty array), all existing options are deleted and the
            supplied list is inserted in the same transaction; `startingPrice`
            is recomputed.
          items:
            $ref: "#/components/schemas/CreateServiceOptionRequest"

    CreateServiceOptionRequest:
      type: object
      properties:
        name: { type: string }
        description:
          type: string
          nullable: true
        price:
          type: string
          description: Decimal as string
        duration: { type: string }
        defaultStartTime:
          type: string
          nullable: true
          description: HH:MM 24h. Pin a single start time for long-duration options.
      required: [name, price, duration]

    UpdateServiceOptionRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        price:
          type: string
          nullable: true
          description: Decimal as string
        duration:
          type: string
          nullable: true
        defaultStartTime:
          type: string
          nullable: true
          description: HH:MM 24h. Pin a single start time for long-duration options. Pass null to clear.

    ApplicationFees:
      type: object
      required: [applicationFeeCents, onboardingFeeCents, currency]
      properties:
        applicationFeeCents: { type: integer, minimum: 0 }
        onboardingFeeCents: { type: integer, minimum: 0 }
        currency: { type: string, enum: [usd] }

    CreateBizAccountRequest:
      type: object
      properties:
        businessName: { type: string }
        ownerName: { type: string }
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        phone:
          type: string
          nullable: true
        businessType:
          type: string
          enum: [brick-and-mortar, home-based]
        yearsInBusiness:
          type: string
          nullable: true
        alaskaLicenseNumber:
          type: string
          nullable: true
        businessDescription:
          type: string
          nullable: true
        expectedApplicationFeeCents:
          type: integer
          minimum: 0
          description: Fee shown to the applicant. If supplied and no longer current, checkout is rejected before creating any records.
      required: [businessName, ownerName, email, password, businessType]

    CreateBizAccountResponse:
      type: object
      description: Newly-created application (in awaiting_payment) plus the Stripe-hosted checkout URL the client must open.
      properties:
        bizAccount:
          $ref: "#/components/schemas/BizAccount"
        checkoutUrl:
          type: string
          description: Stripe Checkout Session URL for the configured application fee. Open this in a browser.
      required: [bizAccount, checkoutUrl]

    OnboardingCheckoutResponse:
      type: object
      description: Stripe-hosted checkout URL for the configured onboarding fee.
      properties:
        checkoutUrl:
          type: string
          description: Stripe Checkout Session URL for the configured onboarding fee. Open this in a browser.
      required: [checkoutUrl]

    ApproveBizAccountRequest:
      type: object
      properties:
        categoryId:
          type: string
          nullable: true
          description: Optional category id to seed the new business with. Defaults to "handyman" if omitted; admin can change it later.
      required: []

    ApproveBizAccountResult:
      type: object
      properties:
        bizAccount:
          $ref: "#/components/schemas/BizAccount"
        business:
          $ref: "#/components/schemas/Business"
      required: [bizAccount, business]

    RejectBizAccountRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
          description: Optional human-readable reason persisted on the application row.
      required: []

    BizAccountStatusResponse:
      type: object
      description: Minimal status snapshot exposed without auth so the payment-return screen can poll until the Stripe webhook lands.
      properties:
        applicationPayment:
          anyOf:
            - $ref: "#/components/schemas/PaymentReceipt"
            - type: "null"
        onboardingPayment:
          anyOf:
            - $ref: "#/components/schemas/PaymentReceipt"
            - type: "null"
        id: { type: string }
        status:
          type: string
          enum: [awaiting_payment, pending, accepted, approved, rejected]
        paidAt:
          type: string
          format: date-time
          nullable: true
        meetingAt:
          type: string
          format: date-time
          nullable: true
          description: In-person meeting time scheduled by the admin after acceptance; null when not scheduled.
        meetingLocation:
          type: string
          nullable: true
          description: Where the in-person meeting takes place (address or notes); null when no meeting is scheduled or no location set.
        meetingDurationMinutes:
          type: integer
          nullable: true
          description: Meeting length in minutes; null when no meeting is scheduled.
      required: [id, status, paidAt, meetingAt, meetingLocation, meetingDurationMinutes]

    PaymentReceipt:
      type: object
      description: Actual amount paid to Stripe, never inferred from current pricing. Absent for historical payments whose receipt was not recorded.
      properties:
        amountCents: { type: integer, minimum: 0 }
        currency: { type: string, pattern: "^[a-z]{3}$" }
      required: [amountCents, currency]

    OnboardingCheckoutInput:
      type: object
      properties:
        expectedOnboardingFeeCents:
          type: integer
          minimum: 0
          description: Amount in USD cents the applicant reviewed. Optional for older clients. A changed price returns 409 before starting checkout.

    UpdateBizAccountRequest:
      type: object
      properties:
        # Admin-only fields:
        status:
          type: string
          enum: [awaiting_payment, pending, accepted, approved, rejected]
          nullable: true
        meetingAt:
          type: string
          format: date-time
          nullable: true
          description: Admin-only — schedule/reschedule the in-person meeting. Explicit null clears it.
        meetingLocation:
          type: string
          nullable: true
          description: Admin-only — where the in-person meeting takes place (address or notes). Included in the calendar invite's LOCATION.
        meetingDurationMinutes:
          type: integer
          nullable: true
          minimum: 15
          maximum: 480
          description: Admin-only — meeting length in minutes (default 60). Sets the calendar invite's end time.
        # SP-owner editable fields:
        phone:
          type: string
          nullable: true
        businessDescription:
          type: string
          nullable: true
        alaskaLicenseNumber:
          type: string
          nullable: true
        yearsInBusiness:
          type: string
          nullable: true
        ownerName:
          type: string
          nullable: true

    Notification:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        kind:
          type: string
          enum: [booking_created, booking_confirmed, booking_completed, booking_cancelled, booking_payment_failed, booking_refunded, refund_requested, refund_approved, refund_denied, dispute_opened, dispute_closed, message_received]
        title: { type: string }
        body: { type: string }
        bookingId:
          type: string
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, userId, kind, title, body, createdAt]

    RegisterPushTokenRequest:
      type: object
      properties:
        pushToken:
          type: string
          nullable: true
          description: Expo push token, e.g. "ExponentPushToken[xxxxx]". Pass null to clear.
      required: [pushToken]

    PlanTier:
      type: string
      enum: [starter_gigger, pro_business]
      description: Subscription plan tier. Starter Gigger=$29/mo (5 services, 9% commission, 3-month booking window); Pro Business=$79/mo (20 services, 6.5% commission, 6-month booking window).

    MySubscriptionResponse:
      type: object
      description: Current SP subscription snapshot used by the mobile dashboard to gate listing creation and surface usage.
      properties:
        plan:
          $ref: "#/components/schemas/PlanTier"
        active:
          type: boolean
          description: True iff the subscription entitles the SP to its plan's perks (Stripe status `active` or `trialing`).
        servicesUsed:
          type: integer
          minimum: 0
          description: How many services the SP currently has listed.
        servicesLimit:
          type: integer
          nullable: true
          minimum: 0
          description: Hard cap on listed services for this plan, or null for unlimited (Premium).
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
          description: ISO timestamp when the current Stripe billing period ends, if any.
        stripeManageUrl:
          type: string
          nullable: true
          description: One-shot Stripe billing-portal URL for managing/cancelling the subscription, if a customer exists.
        priceCents:
          type: integer
          description: Monthly price in cents for the current plan (display-only).
      required: [plan, active, servicesUsed, priceCents]

    CreateSubscriptionCheckoutRequest:
      type: object
      properties:
        plan:
          $ref: "#/components/schemas/PlanTier"
        successUrl:
          type: string
          nullable: true
          description: Optional override for the post-checkout redirect URL.
        cancelUrl:
          type: string
          nullable: true
          description: Optional override for the cancel redirect URL.
      required: [plan]

    SubscriptionCheckoutResponse:
      type: object
      properties:
        url:
          type: string
          description: Stripe-hosted checkout URL.
        sessionId:
          type: string
          description: Stripe Checkout session id.
      required: [url, sessionId]

    BizAccount:
      type: object
      description: Public view of a biz_account (passwordHash never returned)
      properties:
        id: { type: string }
        businessName: { type: string }
        ownerName: { type: string }
        phone: { type: string }
        email: { type: string }
        businessType:
          type: string
          enum: [brick-and-mortar, home-based]
        yearsInBusiness: { type: string }
        alaskaLicenseNumber: { type: string }
        businessDescription: { type: string }
        status:
          type: string
          enum: [awaiting_payment, pending, accepted, approved, rejected]
        appliedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        stripeSessionId:
          type: string
          nullable: true
        ownerId:
          type: string
          nullable: true
        acceptedAt:
          type: string
          format: date-time
          nullable: true
          description: When an admin accepted the application after the interview (status → accepted).
        onboardingSessionId:
          type: string
          nullable: true
          description: Stripe Checkout Session id for the $60 onboarding fee.
        onboardingPaidAt:
          type: string
          format: date-time
          nullable: true
          description: When the $60 onboarding fee was paid (status → approved).
        meetingAt:
          type: string
          format: date-time
          nullable: true
          description: In-person meeting time scheduled by the admin after acceptance.
        meetingLocation:
          type: string
          description: Where the in-person meeting takes place (address or notes). Empty string when not set.
        meetingDurationMinutes:
          type: integer
          description: Meeting length in minutes (default 60).
      required:
        - id
        - businessName
        - ownerName
        - phone
        - email
        - businessType
        - yearsInBusiness
        - alaskaLicenseNumber
        - businessDescription
        - status
        - appliedAt
        - expiresAt

    StripeConnectAccountResponse:
      type: object
      description: |
        Snapshot of the SP's Stripe Connect Express account. `accountId` is
        null only when the SP has never started onboarding. `status` collapses
        Stripe's many flags into the four states the mobile UI cares about.
      properties:
        accountId:
          type: string
          nullable: true
          description: Stripe `acct_…` id, or null if onboarding never started.
        status:
          type: string
          enum: [none, pending, active, restricted]
          description: |
            none = no account yet; pending = account exists but onboarding
            not finished or under review; active = charges + payouts both
            enabled; restricted = Stripe has explicitly disabled the account.
        chargesEnabled:
          type: boolean
          description: Mirror of `account.charges_enabled` from Stripe.
        payoutsEnabled:
          type: boolean
          description: Mirror of `account.payouts_enabled` from Stripe.
        requirementsDue:
          type: array
          items: { type: string }
          description: Stripe `requirements.currently_due` field; empty when none.
      required: [accountId, status, chargesEnabled, payoutsEnabled, requirementsDue]

    EarningsBucket:
      type: object
      description: Aggregated money for one window. All amounts are integer USD cents.
      properties:
        gross:    { type: integer, description: SUM(price) cents — what the SP earned before the platform cut. }
        fees:     { type: integer, description: SUM(platform_fee) cents — what the platform kept. }
        refunded: { type: integer, description: SUM(price) cents for bookings that were refunded back to the customer. }
        net:      { type: integer, description: gross - fees - refunded, in cents. }
        count:    { type: integer, description: Number of paid bookings in this window. }
      required: [gross, fees, refunded, net, count]

    EarningsBalance:
      type: object
      description: Live Stripe Connect balance for the SP's connected account.
      properties:
        pendingCents:   { type: integer, description: Funds still in Stripe's pending bucket awaiting payout. }
        availableCents: { type: integer, description: Funds Stripe could pay out today. }
        currency:       { type: string, description: ISO currency code, e.g. "usd". }
      required: [pendingCents, availableCents, currency]

    EarningsRecentItem:
      type: object
      description: One row in the SP's recent-payments list.
      properties:
        bookingId:     { type: string }
        customerName:  { type: string }
        serviceTitle:  { type: string }
        scheduledDate: { type: string, description: "YYYY-MM-DD" }
        grossCents:    { type: integer }
        feeCents:      { type: integer }
        netCents:      { type: integer, description: 0 if the booking was refunded. }
        refunded:      { type: boolean }
        paidAt:        { type: string, format: date-time, description: When the booking row (and its PaymentIntent) was created. }
      required: [bookingId, customerName, serviceTitle, scheduledDate, grossCents, feeCents, netCents, refunded, paidAt]

    EarningsResponse:
      type: object
      description: Full SP earnings dashboard payload.
      properties:
        currency:       { type: string, description: Always "usd" for v1. }
        lifetime:       { $ref: "#/components/schemas/EarningsBucket" }
        last30Days:     { $ref: "#/components/schemas/EarningsBucket" }
        balance:
          allOf:
            - $ref: "#/components/schemas/EarningsBalance"
          nullable: true
          description: Null when SP hasn't finished Connect onboarding or Stripe is briefly unreachable.
        recentPayments:
          type: array
          items:
            $ref: "#/components/schemas/EarningsRecentItem"
      required: [currency, lifetime, last30Days, balance, recentPayments]

    Message:
      type: object
      description: One chat message on a per-booking thread.
      properties:
        id:           { type: string }
        bookingId:    { type: string }
        senderUserId: { type: string }
        senderRole:
          type: string
          enum: [customer, business]
        body:         { type: string }
        readAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the OTHER party first opens the thread after this message arrived.
        createdAt:    { type: string, format: date-time }
      required: [id, bookingId, senderUserId, senderRole, body, createdAt]

    SendMessageRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: The message text. Trimmed server-side; max 2000 chars after trim.
      required: [body]

    Conversation:
      type: object
      description: One row in the caller's inbox — the latest activity per booking thread.
      properties:
        bookingId:        { type: string }
        counterpartyName: { type: string, description: "If caller is the customer, this is the business's name; if caller is the SP, the customer's name." }
        scheduledDate:    { type: string, description: "YYYY-MM-DD" }
        lastMessageBody:  { type: string }
        lastMessageAt:    { type: string, format: date-time }
        lastMessageFromMe: { type: boolean, description: True when the caller authored the most-recent message. }
        unreadCount:      { type: integer, description: Number of unread messages from the other side. }
      required: [bookingId, counterpartyName, scheduledDate, lastMessageBody, lastMessageAt, lastMessageFromMe, unreadCount]

    StripeConnectOnboardingLinkResponse:
      type: object
      description: One-shot Stripe Account Link URL for the hosted Express onboarding flow.
      properties:
        url:
          type: string
          format: uri
          description: Hosted Stripe URL the mobile client opens via WebBrowser.
        expiresAt:
          type: string
          format: date-time
          description: ISO timestamp at which the URL stops working (~5 min from creation).
      required: [url, expiresAt]
